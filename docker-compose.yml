# Full stack locally:  docker compose up --build   →  http://localhost:3000
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: polar
      POSTGRES_PASSWORD: polar
      POSTGRES_DB: polarnexus
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polar"]
      interval: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://polar:polar@db:5432/polarnexus
      JWT_SECRET: ${JWT_SECRET:-change-me-local-only}
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  pgdata:
