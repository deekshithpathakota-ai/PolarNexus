# Render Blueprint — backend API + managed PostgreSQL. Deploy the frontend on Vercel (see README).
databases:
  - name: polarnexus-db
    plan: free
    databaseName: polarnexus
    user: polar
services:
  - type: web
    name: polarnexus-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase: { name: polarnexus-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      # Render's native Python runtime has no ffmpeg/tesseract and limited memory: keep CLIP off here.
      # Use backend/Dockerfile (runtime: docker) to get OCR, video key frames and visual search.
      - key: VISUAL_SEARCH_PROVIDER
        value: none
